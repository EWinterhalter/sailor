name: Pipeline Sailor scan

on:
  push:
    branches: [ beta ]
  pull_request:
    branches: [ beta ]
  workflow_dispatch:

jobs:
  build:
    name: Build Sailor & Test Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install dependencies
        run: |
          go mod download
          go mod verify

      - name: Build Sailor
        run: |
          go build -v -o sailor main.go
          chmod +x sailor

      - name: Build test Docker images
        run: |
          docker build -f tests/good_container/Dockerfile -t test-app-good:${{ github.sha }} .
          docker build -f tests/bad_container/Dockerfile -t test-app-bad:${{ github.sha }} .

      - name: Save Sailor binary
        uses: actions/upload-artifact@v4
        with:
          name: sailor-binary
          path: sailor
          retention-days: 1

      - name: Save Docker images
        run: |
          docker save test-app-good:${{ github.sha }} -o good-image.tar
          docker save test-app-bad:${{ github.sha }} -o bad-image.tar

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: test-images
          path: |
            good-image.tar
            bad-image.tar
          retention-days: 1

  setup-database:
    name: Setup PostgreSQL
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sailor_user
          POSTGRES_PASSWORD: sailor_pass
          POSTGRES_DB: sailor
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PostgreSQL schema
        env:
          PGPASSWORD: sailor_pass
        run: |
          psql -h localhost -U sailor_user -d sailor -f init.sql
          echo "Database setup successfully"

      - name: Verify database
        env:
          PGPASSWORD: sailor_pass
        run: |
          psql -h localhost -U sailor_user -d sailor -c "\dt"

  scan-good-container:
    name: Scan Secure Container
    runs-on: ubuntu-latest
    needs: [build, setup-database]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sailor_user
          POSTGRES_PASSWORD: sailor_pass
          POSTGRES_DB: sailor
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Sailor binary
        uses: actions/download-artifact@v4
        with:
          name: sailor-binary

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: test-images

      - name: Load good Docker image
        run: |
          docker load -i good-image.tar
          chmod +x sailor

      - name: Setup database
        env:
          PGPASSWORD: sailor_pass
        run: |
          psql -h localhost -U sailor_user -d sailor -f init.sql

      - name: Scan secure container
        run: |
          mkdir -p reports
          ./sailor scan test-app-good:${{ github.sha }} \
            --save-db \
            --db-host localhost \
            --db-user sailor_user \
            --db-password sailor_pass \
            --db-name sailor \
            --save-result reports/good-scan.json

      - name: Upload scan results (good)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: good-container-scan
          path: reports/good-scan.json

  scan-bad-container:
    name: Scan Vulnerable Container
    runs-on: ubuntu-latest
    needs: [build, setup-database]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sailor_user
          POSTGRES_PASSWORD: sailor_pass
          POSTGRES_DB: sailor
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Sailor binary
        uses: actions/download-artifact@v4
        with:
          name: sailor-binary

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: test-images

      - name: Load bad Docker image
        run: |
          docker load -i bad-image.tar
          chmod +x sailor

      - name: Setup database
        env:
          PGPASSWORD: sailor_pass
        run: |
          psql -h localhost -U sailor_user -d sailor -f init.sql

      - name: Scan vulnerable container
        run: |
          mkdir -p reports
          ./sailor scan test-app-bad:${{ github.sha }} \
            --save-db \
            --db-host localhost \
            --db-user sailor_user \
            --db-password sailor_pass \
            --db-name sailor \
            --save-result reports/bad-scan.json

      - name: Upload scan results (bad)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bad-container-scan
          path: reports/bad-scan.json

      - name: Check scan results (fail pipeline if vulnerabilities found)
        run: |
          if [ -f reports/bad-scan.json ]; then
            VULNERABILITIES=$(jq '.vulnerabilities | length' reports/bad-scan.json 2>/dev/null || echo "0")

            echo "Found $VULNERABILITIES vulnerabilities"

            if [ "$VULNERABILITIES" -gt 0 ]; then
              echo "::error::🚨 Found $VULNERABILITIES vulnerabilities in container!"
              exit 1
            fi
          else
            echo "::error::Scan failed to produce results"
            exit 1
          fi

  deploy-or-next-stage:
    name: Next Stage (Should not run if bad container failed)
    runs-on: ubuntu-latest
    needs: [scan-good-container, scan-bad-container]

    steps:
      - name: This should NOT run if bad container is vulnerable
        run: |
          echo "🚀 This step runs only if both scans passed"
